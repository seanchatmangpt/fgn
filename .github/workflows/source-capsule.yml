name: Clean Session Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EVENT_SHA: ${{ github.sha }}

concurrency:
  group: clean-session-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fgn-core:
    name: FGN core / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - name: Admit exact subject
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${SUBJECT_SHA}"
          printf 'subject_sha=%s\nsubject_tree=%s\nevent_sha=%s\n' \
            "${actual_sha}" "$(git rev-parse 'HEAD^{tree}')" "${EVENT_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install verification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[testing]'
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Execute FGN behavioral boundaries
        run: >-
          pytest -q
          tests/test_cli.py
          tests/test_llm_operations.py
          tests/test_dsl_project.py
          tests/test_jinja.py
      - name: Build source distribution
        run: python setup.py sdist
      - name: Verify source distribution exists
        shell: bash
        run: test -s dist/fgn-*.tar.gz

  repository-suite:
    name: Repository suite / Python 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - name: Admit exact subject
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install complete test substrate
        run: python -m pip install --upgrade pip && python -m pip install -e '.[testing]'
      - name: Execute complete repository suite
        run: pytest -q

  source-capsule:
    name: Exact-head source capsule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - name: Admit exact subject
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${SUBJECT_SHA}"
          echo "SUBJECT_TREE=$(git rev-parse 'HEAD^{tree}')" >> "${GITHUB_ENV}"
      - name: Manufacture capsule and receipt
        shell: bash
        run: |
          set -euo pipefail
          capsule="fgn-source-${SUBJECT_SHA}.tar.gz"
          git archive --format=tar --prefix=fgn/ "${SUBJECT_SHA}" | gzip -n > "${capsule}"
          sha256sum "${capsule}" > "${capsule}.sha256"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sha = os.environ["SUBJECT_SHA"]
          capsule = Path(f"fgn-source-{sha}.tar.gz")
          receipt = {
              "schema": "https://chatman.ai/schemas/source-capsule-receipt/v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "subject_commit": sha,
              "subject_tree": os.environ["SUBJECT_TREE"],
              "event_commit": os.environ["EVENT_SHA"],
              "artifact": capsule.name,
              "sha256": Path(f"{capsule}.sha256").read_text().split()[0],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          Path(f"fgn-source-{sha}.receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-capsule-${{ env.SUBJECT_SHA }}
          path: |
            fgn-source-${{ env.SUBJECT_SHA }}.tar.gz
            fgn-source-${{ env.SUBJECT_SHA }}.tar.gz.sha256
            fgn-source-${{ env.SUBJECT_SHA }}.receipt.json
          if-no-files-found: error
          retention-days: 7
