name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-capsule:
    name: Source capsule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Manufacture deterministic source capsule
        shell: bash
        run: |
          set -euo pipefail
          capsule="fgn-source-${GITHUB_SHA}.tar.gz"
          git archive --format=tar --prefix=fgn/ HEAD | gzip -n > "${capsule}"
          sha256sum "${capsule}" > "${capsule}.sha256"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          sha = os.environ["GITHUB_SHA"]
          capsule = Path(f"fgn-source-{sha}.tar.gz")
          receipt = {
              "schema": "https://chatman.ai/schemas/source-capsule-receipt/v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "commit": sha,
              "tree": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^{tree}"], text=True
              ).strip(),
              "artifact": capsule.name,
              "sha256": Path(f"{capsule}.sha256").read_text().split()[0],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          Path(f"fgn-source-{sha}.receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-capsule-${{ github.sha }}
          path: |
            fgn-source-${{ github.sha }}.tar.gz
            fgn-source-${{ github.sha }}.tar.gz.sha256
            fgn-source-${{ github.sha }}.receipt.json
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install verification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[testing]'
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Execute receipt and provider boundaries
        run: pytest -q tests/test_cli.py tests/test_llm_operations.py
      - name: Build source distribution
        run: python setup.py sdist
      - name: Verify source distribution exists
        shell: bash
        run: test -s dist/fgn-*.tar.gz
