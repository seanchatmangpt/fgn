[metadata]
name = fgn
version = 2026.8.5.dev0
description = FGN: receipt-bound AI-powered file generation.
author = Sean Chatman
author_email = info@chatmangpt.com
license = MIT
license_files = LICENSE.txt
long_description = file: README.rst
long_description_content_type = text/x-rst; charset=UTF-8
url = https://github.com/seanchatmangpt/fgn
project_urls =
    Source = https://github.com/seanchatmangpt/fgn
    Tracker = https://github.com/seanchatmangpt/fgn/issues

classifiers =
    Development Status :: 4 - Beta
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13

[options]
zip_safe = False
packages = find:
include_package_data = True
package_dir =
    =src
python_requires = >=3.10
install_requires =
    click>=8.1,<9
    rich>=13,<15
    PyYAML>=6,<7
    pyperclip>=1.8,<2
    loguru>=0.7,<1
    jinja2>=3.1,<4
    Faker>=19,<41
    distro>=1.9,<2

[options.packages.find]
where = src
exclude =
    tests
    tests.*
    __pycache__
    *.__pycache__
    typetemp.template.hackathon
    typetemp.template.hackathon.*

[options.extras_require]
openai =
    openai>=1.0,<3
local_llama =
    langchain>=0.2,<1
template_enhancements =
    inflection>=0.5,<1
    jinja2-time>=0.2,<1
testing =
    pytest>=8,<10
    pytest-cov>=5,<8
    pytest-mock>=3,<4
    build>=1.2,<2

[options.entry_points]
console_scripts =
    fgn = fgn.core.fgn_cli:fgn

[tool:pytest]
addopts = --verbose
testpaths = tests
norecursedirs = dist build .tox

[flake8]
max_line_length = 100
extend_ignore = E203, W503
exclude = .tox,build,dist,.eggs,docs/conf.py

[pyscaffold]
version = 4.5
package = fgn
extensions = github_actions pre_commit
