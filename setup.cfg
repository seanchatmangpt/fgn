[metadata]
name = fgn
version = 2026.8.5.dev0
description = FGN: receipt-bound AI-powered file generation.
author = Sean Chatman
author_email = info@chatmangpt.com
license = MIT
license_files = LICENSE.txt
long_description = file: README.rst
long_description_content_type = text/x-rst; charset=UTF-8
url = https://github.com/seanchatmangpt/fgn
project_urls =
    Source = https://github.com/seanchatmangpt/fgn
    Tracker = https://github.com/seanchatmangpt/fgn/issues

classifiers =
    Development Status :: 4 - Beta
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13

[options]
zip_safe = False
packages = find:
include_package_data = True
package_dir =
    =src
python_requires = >=3.10
install_requires =
    click>=8.1,<9
    rich>=13,<15
    openai>=1.0,<3
    PyYAML>=6,<7
    pyperclip>=1.8,<2
    loguru>=0.7,<1
    requests>=2.31,<3
    jsonschema>=4.19,<5
    pydantic>=1.10,<3
    jinja2>=3.1,<4
    inflection>=0.5,<1
    Faker>=19,<40
    PyGithub>=2,<3
    markdown2>=2.4,<3
    lxml>=4.9,<7
    dataclasses-json>=0.6,<1
    jinja2-time>=0.2,<1

[options.packages.find]
where = src
exclude =
    tests
    tests.*
    __pycache__
    *.__pycache__

[options.extras_require]
testing =
    pytest>=8,<9
    pytest-cov>=5,<7
    pytest-mock>=3,<4
    pyfakefs>=5,<6
    pytest-bdd>=7,<9
    requests-mock>=1.12,<2
    build>=1.2,<2

[options.entry_points]
console_scripts =
    fgn = fgn.core.fgn_cli:fgn

[tool:pytest]
addopts = --verbose
testpaths = tests
norecursedirs = dist build .tox

[flake8]
max_line_length = 100
extend_ignore = E203, W503
exclude = .tox,build,dist,.eggs,docs/conf.py

[pyscaffold]
version = 4.5
package = fgn
extensions = github_actions pre_commit
